name: firefly-iii
services:
  app:
    image: fireflyiii/core:latest
    hostname: app
    restart: unless-stopped
    volumes:
      - /srv/tank/firefly-iii/upload:/var/www/html/storage/upload
    ports:
      - 127.0.0.1:8007:8080
    depends_on:
      - db
  db:
    image: mariadb:lts
    hostname: db
    restart: unless-stopped
    volumes:
      - /srv/tank/firefly-iii/db:/var/lib/mysql
