name: ntfy
services:
  server:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command:
      - serve
    environment:
      - TZ=Europe/Paris
    volumes:
      - /var/stacks/ntfy/cache:/var/cache/ntfy
    ports:
      - 127.0.0.1:8001:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    init: true
