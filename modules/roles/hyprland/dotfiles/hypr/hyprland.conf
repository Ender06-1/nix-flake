monitor=,preferred,auto,auto
monitor = eDP-1,2256x1504@60,auto,1.333333
monitor = desc:AOC 24G2W1G3- 1J4QBHA003151,1920x1080@165.00Hz,auto,1
monitor = desc:Samsung Electric Company S24D330 0x5A5A5131,1920x1080@60.00Hz,auto-right,1


exec-once = systemctl --user start hyprpolkitagent
exec-once = caelestia shell -d


env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = _JAVA_AWT_WM_NONREPARENTING, 1


general {
    layout = dwindle

    allow_tearing = false

    gaps_in = 0
    gaps_out = 5
    border_size = 2

    col.active_border = rgb(c6b569)
    col.inactive_border = rgb(333231)
}


decoration {
    rounding = 20

    blur {
      enabled = false;
    }

    shadow {
      enabled = false;
    }
}


animations {
    enabled = true

    # Animation curves
    bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1

    # Animation configs
    animation = layersIn, 1, 5, emphasizedDecel, slide
    animation = layersOut, 1, 4, emphasizedAccel, slide
    animation = fadeLayers, 1, 5, standard

    animation = windowsIn, 1, 5, emphasizedDecel
    animation = windowsOut, 1, 3, emphasizedAccel
    animation = windowsMove, 1, 6, standard
    animation = workspaces, 1, 5, standard

    animation = specialWorkspace, 1, 4, specialWorkSwitch, slidefadevert 15%

    animation = fade, 1, 6, standard
    animation = fadeDim, 1, 6, standard
    animation = border, 1, 6, standard
}


dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}


misc {
    vfr = true
    vrr = 1

    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    disable_hyprland_logo = true
    force_default_wallpaper = 0

    allow_session_lock_restore = true
    middle_click_paste = false
    focus_on_activate = true
    session_lock_xray = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    background_color = rgb(222017)
}


input {
    kb_layout = us
    numlock_by_default = true

    repeat_delay = 200
    repeat_rate = 40

    kb_options = compose:ralt

    focus_on_close = 1

    follow_mouse = false

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 0.3
    }
}


gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}
gesture = 4, horizontal, workspace
gesture = 3, up, special, special
gesture = 3, down, dispatcher, exec, caelestia toggle specialws


device {
  name = razer-razer-mamba-tournament-edition
  accel_profile = flat
  sensitivity = -0.25
}

device {
  name = razer-razer-basilisk-v3
  accel_profile = flat
}


binds {
    scroll_event_delay = 0
}
exec = hyprctl dispatch submap global
submap = global

bindi = Super, Super_L, global, caelestia:launcher
bindin = Super, catchall, global, caelestia:launcherInterrupt
bindin = Super, mouse:272, global, caelestia:launcherInterrupt
bindin = Super, mouse:273, global, caelestia:launcherInterrupt
bindin = Super, mouse:274, global, caelestia:launcherInterrupt
bindin = Super, mouse:275, global, caelestia:launcherInterrupt
bindin = Super, mouse:276, global, caelestia:launcherInterrupt
bindin = Super, mouse:277, global, caelestia:launcherInterrupt
bindin = Super, mouse_up, global, caelestia:launcherInterrupt
bindin = Super, mouse_down, global, caelestia:launcherInterrupt

bindl = Super+Shift, N, global, caelestia:clearNotifs
bind = Super, P, global, caelestia:lock

bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

bindr = Ctrl+Super+Shift, R, exec, caelestia shell --kill
bindr = Ctrl+Super+Alt, R, exec, caelestia shell --kill && sleep 3 && caelestia shell -d

bind = Super+Shift, P, exec, systemctl suspend-then-hibernate

$wsaction = ~/.config/hypr/scripts/wsaction.fish
bind = Super, 1, exec, $wsaction workspace 1
bind = Super, 2, exec, $wsaction workspace 2
bind = Super, 3, exec, $wsaction workspace 3
bind = Super, 4, exec, $wsaction workspace 4
bind = Super, 5, exec, $wsaction workspace 5
bind = Super, 6, exec, $wsaction workspace 6
bind = Super, 7, exec, $wsaction workspace 7
bind = Super, 8, exec, $wsaction workspace 8
bind = Super, 9, exec, $wsaction workspace 9
bind = Super, 0, exec, $wsaction workspace 10
bind = Super+Shift, 1, exec, $wsaction movetoworkspace 1
bind = Super+Shift, 2, exec, $wsaction movetoworkspace 2
bind = Super+Shift, 3, exec, $wsaction movetoworkspace 3
bind = Super+Shift, 4, exec, $wsaction movetoworkspace 4
bind = Super+Shift, 5, exec, $wsaction movetoworkspace 5
bind = Super+Shift, 6, exec, $wsaction movetoworkspace 6
bind = Super+Shift, 7, exec, $wsaction movetoworkspace 7
bind = Super+Shift, 8, exec, $wsaction movetoworkspace 8
bind = Super+Shift, 9, exec, $wsaction movetoworkspace 9
bind = Super+Shift, 0, exec, $wsaction movetoworkspace 10

bind = Super, S, exec, caelestia toggle specialws
bind = Super+Shift, S, exec, caelestia toggle communication

bind = Super, H, movefocus, l
bind = Super, L, movefocus, r
bind = Super, K, movefocus, u
bind = Super, J, movefocus, d
bind = Super+Shift, H, movewindow, l
bind = Super+Shift, L, movewindow, r
bind = Super+Shift, K, movewindow, u
bind = Super+Shift, J, movewindow, d
binde = Super, Minus, splitratio, -0.1
binde = Super, Equal, splitratio, 0.1
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow
bind = Super, I, pin
bind = Super+Shift, F, fullscreen, 0
bind = Super, F, togglefloating,
bind = Super+Shift, Q, killactive,

bind = Super, RETURN, exec, app2unit -- kitty
bind = Super, E, exec, app2unit -- nautilus
bind = Super, B, exec, app2unit -- firefox

bindl = , Print, exec, caelestia screenshot  # Full screen capture > clipboard
bind = Shift, Print, global, caelestia:screenshot  # Capture region
bind = Super+Shift, Print, global, caelestia:screenshotFreeze  # Capture region (freeze)
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker

bind = Super, V, exec, pkill fuzzel || caelestia clipboard
bind = Super+Alt, V, exec, pkill fuzzel || caelestia clipboard -d
bind = Super, Period, exec, pkill fuzzel || caelestia emoji -p

submap = reset


xwayland {
  force_zero_scaling = true
}


cursor {
    hotspot_padding = 1
}

windowrule = opacity 1.0 override, fullscreen:1

windowrule = opaque on, class:foot|equibop|org\.quickshell|imv|swappy
windowrule = center 1, floating:1, xwayland:1

windowrule = float, class:org\.quickshell

windowrule = workspace special:sysmon, class:btop
windowrule = workspace special:music, class:feishin|Spotify|Supersonic|Cider
windowrule = workspace special:communication, class:discord|equibop|vesktop|whatsapp
windowrule = workspace special:todo, class:Todoist

windowrule = float, title:Friends List, class:steam
windowrule = immediate on, class:steam_app_[0-9]+  # Allow tearing for steam games
windowrule = idleinhibit always, class:steam_app_[0-9]+  # Always idle inhibit when playing a steam game

windowrule = nodim on, xwayland:1, title:win[0-9]+
windowrule = noshadow on, xwayland:1, title:win[0-9]+
windowrule = rounding 10, xwayland:1, title:win[0-9]+

workspace = w[tv1]s[false], gapsout:20
workspace = f[1]s[false], gapsout:20
